# ============================================================
# Amlogic S905X3 / SM1
# OpenOCD + J-Link
# Cortex-A55 EL3 debugging
# ============================================================

adapter driver jlink

transport select jtag
adapter speed 2000

reset_config trst_and_srst

# ------------------------------------------------------------
# Chip / DAP
# ------------------------------------------------------------

set _CHIPNAME amlogic
set _DAP_TAPID 0x6ba00477

jtag newtap $_CHIPNAME tap \
    -irlen 4 \
    -ircapture 0x1 \
    -irmask 0x03 \
    -expected-id $_DAP_TAPID \
    -enable

dap create $_CHIPNAME.dap \
    -chain-position $_CHIPNAME.tap

# ------------------------------------------------------------
# CoreSight address map selection
# ------------------------------------------------------------
#
# 0 = physical/debug aperture mapping
# 1 = high remapped/secure mapping
#
# Some BL31/MMU configurations work better with
# one mapping or the other.
#
# Change:
#   set USE_HIGH_DBGBASE 0
# or:
#   set USE_HIGH_DBGBASE 1
#
# ------------------------------------------------------------

set USE_HIGH_DBGBASE 0

# ------------------------------------------------------------
# Physical/debug aperture mapping
# ------------------------------------------------------------

if { $USE_HIGH_DBGBASE == 0 } {

    set DBGBASE {
        0x80410000
        0x80510000
        0x80610000
        0x80710000
    }

    set CTIBASE {
        0x80420000
        0x80520000
        0x80620000
        0x80720000
    }

    echo "Using low physical CoreSight mapping"

} else {

# ------------------------------------------------------------
# High secure/remapped mapping
# ------------------------------------------------------------

    set DBGBASE {
        0xc0410000
        0xc0c10000
        0xc1410000
        0xc1c10000
    }

    set CTIBASE {
        0xc0430000
        0xc0c20000
        0xc1420000
        0xc1c20000
    }

    echo "Using high remapped CoreSight mapping"
}

# ------------------------------------------------------------
# Number of cores
# ------------------------------------------------------------
#
# Recommended:
#   set _cores 1
#
# Some firmware keeps other cores powered down,
# causing STICKY ERROR during examination.
#
# ------------------------------------------------------------

set _cores 1

# ------------------------------------------------------------
# Create targets
# ------------------------------------------------------------

for { set _core 0 } { $_core < $_cores } { incr _core } {

    cti create $_CHIPNAME.cti$_core \
        -dap $_CHIPNAME.dap \
        -ap-num 0 \
        -baseaddr [lindex $CTIBASE $_core]

    target create $_CHIPNAME.cpu.$_core aarch64 \
        -dap $_CHIPNAME.dap \
        -coreid $_core \
        -dbgbase [lindex $DBGBASE $_core] \
        -cti $_CHIPNAME.cti$_core

    $_CHIPNAME.cpu.$_core configure -event reset-assert-post {
        aarch64 dbginit
    }

    $_CHIPNAME.cpu.$_core configure -event gdb-attach {
        halt
    }
}

# ------------------------------------------------------------
# GDB
# ------------------------------------------------------------

gdb memory_map disable
gdb flash_program disable

# ------------------------------------------------------------
# Init
# ------------------------------------------------------------

# reset/halt may destabilize SCP/debug on Amlogic
# init+halt is usually more stable

init
#reset
#halt

# ============================================================
# EL2H -> EL3H transition stub
# ============================================================

proc el3_switch {} {
halt
# 0xd4000003 = smc #0
# 0xd4200000 = brk #0
#mww 0x20000000 0xd4000003
mww 0xd7f00000 0xd4000003
#mww 0x5000000 0xd4000003
#mww 0xd7f00000 0xd4000023

reg pc 0xd7f00000
#reg pc 0x5000000
#reg pc 0x20000000
#resume
step
halt
}

proc el3_exit {} {
    halt
    reg pc 0x051254e4
    step
    halt
}

proc test {} {
    mww 0xd7f00000 0xd4000003
    bp 0x512509c 4 hw
    reg pc 0xd7f00000
    resume
}

proc test_1 {} {
    mww 0x20000000 0xd4000003
    bp 0x512509c 4 hw
    reg pc 0x20000000
    resume
}



# CPU enters EL3 exception path

proc mmu_off {} {
    halt
    #bl31_18
    reg pc 0x51238bc
    resume
    halt
    #bl31_build
    
    #reg pc 0x51063c4
    #resume
    #halt
    
    #Last_build
    #reg pc 0x5106308
    #resume
    #halt
    # park CPU
    #reg pc 0x51257b4
    #resume
    #halt
}

proc mmu_on {} {
    halt

    reg x0 0x81005
    #bl31_18
    reg pc 0x51238bc
    #bl31_build
    #reg pc 0x51059ec

    resume
    halt

    # park CPU
    reg pc 0x51257b4
    resume
    halt
}
